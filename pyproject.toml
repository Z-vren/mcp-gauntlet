[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gauntlet"
version = "0.1.0"
description = "Security scanner for MCP servers: lint tool manifests for prompt injection and pin them against rug pulls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Z-vren" }]
keywords = ["mcp", "model-context-protocol", "security", "prompt-injection", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Deliberately empty: a security scanner should not widen your supply chain.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gauntlet = "mcp_gauntlet.cli:main"
mcp-gauntlet = "mcp_gauntlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
